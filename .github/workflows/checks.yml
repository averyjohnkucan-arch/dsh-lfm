name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.strictDepBuilds=false
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm pack --out /tmp/dsh-lfm.tgz
      - name: Publish plugin release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" /tmp/dsh-lfm.tgz --target "$GITHUB_SHA" --title "LFM $version" --notes 'Local LFM3-1.7B and LFM3-VL-2B GGUF imports, automatic projector discovery, saved per-model controls, native memory fitting, prefill/decode benchmarks, and an automatic verified official llama.cpp runtime. See README and docs/validation.md for test scope.'
          fi
