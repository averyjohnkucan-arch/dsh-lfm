name: checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile --ignore-scripts --config.strictDepBuilds=false
      - run: pnpm run build && git diff --exit-code -- client.js
      - run: pnpm run check
      - run: pnpm test
      - run: pnpm pack --pack-destination /tmp
      - name: Publish plugin release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" "/tmp/dsh-lfm-$version.tgz" --target "$GITHUB_SHA" --title "LFM $version" --notes 'Create named chat reasoning modes with independent thinking, sampling, and output limits. Includes editable Math/Sci - Creative and Code/Tools - Rigid modes for LFM3-1.7B. Supports DeepSeek Harness 0.2.2-rc.4.'
          fi
